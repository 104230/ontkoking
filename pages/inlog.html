<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen - Ontkoking</title>
    <link rel="stylesheet" href="../css/inlog.css">
    <script src="../javascript/inlog.js" defer></script>
</head>
<body>
    <header>
        <button type="button" onclick="window.location.href='homepage.html'">Home</button>
    </header>
<main>
    <form id="form" action="../php/inloggen.php" method="POST">
        <h1>Inloggen</h1>
        <p id="error" role="alert"></p>

        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
        >

        <label for="password">Wachtwoord</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button type="submit" class="primary">Inloggen</button>
        <a href="registreren.html">Account maken</a>
    </form>
</main>
</body>
</html>
