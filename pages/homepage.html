<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recepten - Ontkoking</title>
    <link rel="stylesheet" href="../css/homepage.css">
</head>
<body>
    <header>
        <input type="text" id="search" placeholder="Zoeken">

        <button type="button" onclick="window.location.href='toevoeg.html'">
            + Recept
        </button>

        <button type="button" onclick="window.location.href='inlog.html'">
            <div class="avatar">Inloggen</div>
        </button>
    </header>

    <main>
        <div class="filters">
            <button class="dark" data-category="alles">Alles</button>
            <button data-category="ontbijt">Ontbijt</button>
            <button data-category="lunch">Lunch</button>
            <button data-category="avondeten">Avondeten</button>
            <button data-category="dessert">Dessert</button>
        </div>

        <div class="hero">
            <div class="photo"></div>

            <div>
                <h2>Laat Gen Z Koken!</h2>
                <p>Ontdek recepten en deel je eigen gerechten.</p>

                <button type="button" onclick="window.location.href='toevoeg.html'">
                    Recept toevoegen
                </button>
            </div>
        </div>

        <h2>Alle recepten</h2>

        <div class="grid">
            <p>Recepten laden...</p>
        </div>
    </main>

    <script src="../javascript/homepage.js"></script>
</body>
</html>
